name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (vars.CI_RUNNER_PUBLIC || 'ubuntu-24.04') || 'ubuntu-24.04' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Fetch the contract over HTTPS
        # The contract is a public repository, and an older lock may record its dependency over ssh; a runner has no key.
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      # OpenCode installs plugins without lifecycle scripts, and no dev dependency needs them.
      - run: npm ci --ignore-scripts
      # The tag ships the committed bundle, so a stale dist/ fails here rather than at install time.
      - name: The committed bundle is current
        run: npm run bundle && git diff --exit-code dist/
      # Parser drift, typecheck, bundle, unit, pack, then plugin-kit check. The kit does not run these steps.
      - run: npm run check
      # Install the pushed head the way a person does, in an isolated home. A fork head SHA is not in the org repo.
      - name: Install the pushed head in an isolated OpenCode home
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          npm install --global @opencode/cli@2.4.1
          H=$(mktemp -d)
          export HOME="$H"
          export XDG_CONFIG_HOME="$H/c"
          export XDG_CACHE_HOME="$H/k"
          export XDG_DATA_HOME="$H/d"
          export XDG_STATE_HOME="$H/s"
          opencode plugin add "github:we-the-rebel-alliance/databricks-plugin#${HEAD_SHA}"
          test -n "$(find "$H/k" -path '*node_modules/@we-the-rebel-alliance/databricks-plugin/dist/index.js' -type f -print -quit)"
