name: release

# A tag v<package.json version> on a master commit whose CI passed publishes the GitHub Release. Releases are not
# published to npm: a consumer pins the tag, github:we-the-rebel-alliance/databricks-plugin#v<version>.
#
# The owner cuts the tag after reviewing the merged pull request; this workflow verifies and publishes it, and never
# moves a tag.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Pack the tagged tree
        run: npm pack
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release create "$TAG" ./*.tgz --repo "$REPO" --verify-tag --title "$TAG" --generate-notes
